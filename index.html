<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TurkeyVisited</title>
  <link rel="stylesheet" href="styles.css">

  <script src="https://d3js.org/d3.v5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.3.2/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/g/filesaver.js"></script>
</head>

<body>

  <div id="welcome_text">Ziyaret ettiğiniz illeri işaretleyin</div>
  <div class="subnav"><a href="mindknit.html">Mindknit Eşyalar</a></div>

  <div id="stats_bar">
    <span>Ziyaret edilen: <strong id="visit_count">0</strong> / 81</span>
    <span>Tamamlanma: <strong id="visit_percent">0%</strong></span>
  </div>

  <div id="map_container"></div>

  <div class="controls">
    <div class="yazi-field">
      <label for="yazi">Harita alt yazısı:</label>
      <input type="text" id="yazi" placeholder="ör. Ozan'ın gezi haritası">
    </div>
    <button class="btn btn-primary" onclick="downloadMap()">Haritayı İndir</button>
    <label for="hyukle" class="btn">Harita Yükle (.txt)</label>
    <input id="hyukle" type="file" accept="text/plain" onchange="openFile(event)">
    <button class="btn btn-ghost" onclick="clearAll()">Tümünü Temizle</button>
  </div>

  <script src="turkeyvisited.js"></script>
</body>

</html>
